name: CI

# Until now this repo had only `release.yml` (tag-triggered), so pull requests
# carried no automated gate at all — a PR could typecheck-fail, break the test
# suite, or fail to build and nothing would say so.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHAs pinned to match release.yml — no new action sources.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Tags: the version check compares package.json against the newest one.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # The console's auth boundary — login gate, CSRF, host allowlist and the
      # server-side attachment of the gateway token — is a framework feature, so
      # patch currency on Next is a security control here, not hygiene. This step
      # is what keeps that true after the 16.3.4 bump.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # The console's auth boundary leans on framework and hook correctness, and
      # `tsc` cannot see a hook mistake. Until this step existed there was no
      # linter in the repo at all — `next lint` was removed in Next 16, so the
      # `lint` script had been a no-op error for a while.
      - name: Lint
        run: npm run lint

      # `package.json` said 0.2.0 while the shipped tag was v0.3.27. Falling
      # behind is the failure that happened, so that is what this fails on;
      # bumping ahead of the tag (a release PR) is allowed.
      - name: Version is not behind the newest tag
        run: |
          node scripts/check-version.mjs --self-test
          node scripts/check-version.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # `next build` needs the gateway URL to exist but never contacts it at
      # build time; the routes that talk to the gateway are all force-dynamic.
      - name: Build
        run: npm run build
        env:
          RANTAICLAW_GATEWAY_URL: http://127.0.0.1:9393

# Deliberately no lint step: `next lint` was removed in Next 16, and the `lint`
# script left in package.json now fails with "no such directory: lint". Wiring
# ESLint back up is a separate change from establishing a gate at all.
