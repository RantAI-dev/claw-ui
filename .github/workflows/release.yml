name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release + upload assets
  id-token: write   # cosign keyless OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: scripts/package-standalone.sh "${GITHUB_REF_NAME}"
      - name: Smoke test — artifact boots on loopback
        run: |
          tmp="$(mktemp -d)"
          tar xzf "dist/claw-ui-${GITHUB_REF_NAME}.tar.gz" -C "$tmp"
          HOSTNAME=127.0.0.1 PORT=3939 RANTAICLAW_UI_SECRET="ci-smoke-test-secret" node "$tmp/server.js" &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:3939/login" && ok=1 && break
            sleep 1
          done
          kill "$pid" || true
          test "${ok:-0}" = "1" || { echo "artifact failed to serve" >&2; exit 1; }
      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1
      - name: cosign sign the archive (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle "dist/claw-ui-${GITHUB_REF_NAME}.tar.gz.bundle" \
            "dist/claw-ui-${GITHUB_REF_NAME}.tar.gz"
      - name: Publish release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: |
            dist/claw-ui-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS
            dist/claw-ui-${{ github.ref_name }}.tar.gz.bundle
